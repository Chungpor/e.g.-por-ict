<!-- Exchange / Pair Avatar Replacement Engine -->
<script>
  (function () {
    const SVG_FALLBACKS = {
      XAUUSD: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#cc8e00"/><g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"><polygon points="37,44 63,44 59,29 41,29"/><polygon points="22,66 48,66 44,51 26,51"/><polygon points="52,66 78,66 74,51 56,51"/></g><polygon points="37,44 63,44 59,33" fill="#fff"/><polygon points="22,66 48,66 44,55" fill="#fff"/><polygon points="52,66 78,66 74,55" fill="#fff"/></svg>'),
      BTCUSD: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#f7931a"/><text x="50" y="69" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="56" transform="rotate(12 50 50)">₿</text></svg>'),
      ETHUSD: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#627eea"/><polygon points="50,14 27,51 50,40" fill="#fff"/><polygon points="50,14 73,51 50,40" fill="#c0cbf6"/><polygon points="50,62 27,51 50,40" fill="#c0cbf6"/><polygon points="50,62 73,51 50,40" fill="#8197ee"/><polygon points="50,86 27,56 50,67" fill="#fff"/><polygon points="50,86 73,56 50,67" fill="#c0cbf6"/></svg>'),
      EURUSD: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#d9a300" stroke="#ffbe00" stroke-width="6"/><text x="48" y="70" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="60">€</text></svg>'),
      GBPUSD: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#5a1f7d"/><text x="50" y="71" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-weight="bold" font-size="62">£</text></svg>'),
      USDJPY: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#1b4fd8"/><circle cx="50" cy="50" r="35" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="95 15"/><text x="50" y="67" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="50">$</text></svg>')
    };

    const PAIR_IMAGE_FILES = {
      XAUUSD: ["image_6652d9.png", "xauusd.png", "images/xauusd.png", "images/image_6652d9.png"],
      BTCUSD: ["image_665600.png", "btcusd.png", "images/btcusd.png", "images/image_665600.png"],
      ETHUSD: ["image_66565b.png", "ethusd.png", "images/ethusd.png", "images/image_66565b.png"],
      EURUSD: ["image_7034b8.png", "eurusd.png", "images/eurusd.png", "images/image_7034b8.png"],
      GBPUSD: ["image_70381d.png", "gbpusd.png", "images/gbpusd.png", "images/image_70381d.png"],
      USDJPY: ["image_704059.png", "usdjpy.png", "images/usdjpy.png", "images/image_704059.png"]
    };

    function normalizePairKey(raw) {
      if (!raw) return null;
      const s = String(raw).trim();
      if (/^Au$/i.test(s)) return "XAUUSD";
      if (/^(Ξ|ETH)$/i.test(s)) return "ETHUSD";
      if (/^(₿|BTC)$/i.test(s)) return "BTCUSD";
      if (/^(€|EUR)$/i.test(s)) return "EURUSD";
      if (/^(£|GBP)$/i.test(s)) return "GBPUSD";
      if (/^(¥|\$|JPY)$/i.test(s)) return "USDJPY";

      const clean = s.toUpperCase().replace(/[^A-Z]/g, "");
      if (clean.includes("XAU") || clean.includes("GOLD") || clean.includes("PAXG")) return "XAUUSD";
      if (clean.includes("BTC")) return "BTCUSD";
      if (clean.includes("ETH")) return "ETHUSD";
      if (clean.includes("EUR")) return "EURUSD";
      if (clean.includes("GBP")) return "GBPUSD";
      if (clean.includes("JPY") || clean === "USDJPY") return "USDJPY";
      return PAIR_IMAGE_FILES[clean] ? clean : null;
    }

    function createPairIconElement(pairKey) {
      const sources = PAIR_IMAGE_FILES[pairKey] || [];
      const fallbackSvg = SVG_FALLBACKS[pairKey] || "";
      const img = document.createElement("img");
      img.className = "pair-icon-img";
      img.alt = pairKey;
      img.dataset.pairIcon = pairKey;
      let tryIdx = 0;

      img.onerror = function () {
        tryIdx++;
        if (tryIdx < sources.length) {
          img.src = sources[tryIdx];
        } else if (fallbackSvg && img.src !== fallbackSvg) {
          img.src = fallbackSvg;
        }
      };

      img.src = sources[0] || fallbackSvg;
      return img;
    }

    window.PAIR_IMAGES = {
      XAUUSD: "image_6652d9.png",
      BTCUSD: "image_665600.png",
      ETHUSD: "image_66565b.png",
      EURUSD: "image_7034b8.png",
      GBPUSD: "image_70381d.png",
      USDJPY: "image_704059.png"
    };
    window.getPairIcon = function (pair) {
      const key = normalizePairKey(pair);
      return key ? PAIR_IMAGE_FILES[key][0] : null;
    };
    window.getPairIconHtml = function (pair) {
      const key = normalizePairKey(pair);
      if (!key) return "";
      const src = PAIR_IMAGE_FILES[key][0];
      const fb = SVG_FALLBACKS[key];
      return `<img src="${src}" onerror="this.onerror=null;this.src='${fb}';" class="pair-icon-img" alt="${key}" />`;
    };

    const PAIR_TITLE_REGEX = /^(XAU\/?USD|BTC\/?USD[T]?|ETH\/?USD[T]?|EUR\/?USD|GBP\/?USD|USD\/?JPY|GOLD|PAXG\/?USD[T]?)$/i;
    const BADGE_SYMBOL_REGEX = /^(Au|Ξ|₿|€|£|¥|\$|XAU|BTC|ETH|EUR|GBP|JPY)$/i;

    function replaceBadgeWithImage(badgeEl, pairKey) {
      if (!badgeEl || !pairKey) return;
      if (badgeEl.dataset.avatarReplaced === pairKey) return;
      badgeEl.dataset.avatarReplaced = pairKey;
      badgeEl.classList.add("rs-replaced-avatar");
      badgeEl.textContent = "";
      badgeEl.appendChild(createPairIconElement(pairKey));
    }

    function swapCardAvatars(root) {
      if (!root) return;

      const allNodes = root.querySelectorAll("span, strong, b, div, h2, h3, h4, p");
      allNodes.forEach((el) => {
        if (el.children.length > 0) return;
        const txt = (el.textContent || "").trim();
        if (!PAIR_TITLE_REGEX.test(txt)) return;

        const pairKey = normalizePairKey(txt);
        if (!pairKey) return;

        let badgeCandidate = el.previousElementSibling;
        if (!badgeCandidate && el.parentElement) {
          badgeCandidate = el.parentElement.previousElementSibling;
        }
        if (!badgeCandidate && el.parentElement && el.parentElement.parentElement) {
          const headerRow = el.parentElement.parentElement;
          const firstChild = headerRow.firstElementChild;
          if (firstChild && firstChild !== el.parentElement && !firstChild.contains(el)) {
            badgeCandidate = firstChild;
          }
        }

        if (badgeCandidate) {
          replaceBadgeWithImage(badgeCandidate, pairKey);
        }
      });

      const badgeNodes = root.querySelectorAll("span, div, i, b, strong");
      badgeNodes.forEach((el) => {
        if (el.dataset.avatarReplaced) return;
        if (el.children.length > 0) return;
        const txt = (el.textContent || "").trim();
        if (!BADGE_SYMBOL_REGEX.test(txt)) return;

        const cardHeader = el.parentElement ? el.parentElement.textContent : "";
        const pairKey = normalizePairKey(cardHeader) || normalizePairKey(txt);
        if (pairKey) {
          replaceBadgeWithImage(el, pairKey);
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("caRecent") || document.body;
      swapCardAvatars(container);

      const observer = new MutationObserver(function () {
        swapCardAvatars(container);
      });
      observer.observe(container, { childList: true, subtree: true });
    });
  })();
</script>

<!-- Load Shared Production Trade Store (+ legacy filename & inline fallback) and Recent Signals Engine -->
<script src="trades-store.js"></script>
<script src="Trades%20store%20.js"></script>
<script>
  if (!window.PorTrades) {
    (function () {
      const BN_HOSTS = [
        "https://api.binance.com",
        "https://data-api.binance.vision",
        "https://api1.binance.com",
        "https://api2.binance.com",
        "https://api3.binance.com",
      ];
      const SETTINGS_KEY = "por_trades_settings";
      const MAX_TRADES = 500;
      let hostIdx = 0;

      function timeoutSignal(ms) {
        if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") {
          return AbortSignal.timeout(ms);
        }
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), ms);
        return ctrl.signal;
      }

      function resolveBnSymbol(pair) {
        if (!pair) return null;
        const clean = String(pair).toUpperCase().replace(/[^A-Z]/g, "");
        const map = {
          BTC: "BTCUSDT",
          BTCUSD: "BTCUSDT",
          BTCUSDT: "BTCUSDT",
          ETH: "ETHUSDT",
          ETHUSD: "ETHUSDT",
          ETHUSDT: "ETHUSDT",
          XAU: "PAXGUSDT",
          XAUUSD: "PAXGUSDT",
          GOLD: "PAXGUSDT",
          PAXG: "PAXGUSDT",
          PAXGUSD: "PAXGUSDT",
          PAXGUSDT: "PAXGUSDT",
          SOL: "SOLUSDT",
          SOLUSD: "SOLUSDT",
          SOLUSDT: "SOLUSDT",
          BNB: "BNBUSDT",
          BNBUSD: "BNBUSDT",
          BNBUSDT: "BNBUSDT",
        };
        return map[clean] || (clean.endsWith("USDT") ? clean : null);
      }

      function userKey() {
        let email = "guest";
        try {
          email = localStorage.getItem("por_active_user") || "guest";
        } catch (e) {}
        return "por_trades_v1_" + email;
      }

      function load() {
        try {
          const v = JSON.parse(localStorage.getItem(userKey()) || "[]");
          return Array.isArray(v) ? v : [];
        } catch (e) {
          return [];
        }
      }

      function save(list) {
        try {
          localStorage.setItem(userKey(), JSON.stringify(list.slice(0, MAX_TRADES)));
          return true;
        } catch (e) {
          return false;
        }
      }

      function settings() {
        let s = {};
        try {
          s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        } catch (e) {}
        return { winTp: [1, 2, 3].includes(s.winTp) ? s.winTp : 1 };
      }

      function setSettings(patch) {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({ ...settings(), ...patch }));
        } catch (e) {}
      }

      function add(sig) {
        const list = load();
        const dup = list.find(
          (t) =>
            !t.manual &&
            t.pair === sig.pair &&
            t.tf === sig.tf &&
            t.dir === sig.dir &&
            Math.abs(t.sl - sig.sl) < Math.abs(sig.entry - sig.sl) * 0.02 &&
            resultOf(t).state === "open"
        );
        if (dup) return { trade: dup, duplicate: true };

        const bnSymbol = sig.bn || resolveBnSymbol(sig.pair);
        const parsedTps = Array.isArray(sig.tps)
          ? sig.tps.map(Number)
          : [sig.tp1, sig.tp2, sig.tp3].filter((v) => v != null).map(Number);

        const trade = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          createdAt: Date.now(),
          pair: sig.pair,
          image: sig.image || (window.getPairIcon ? window.getPairIcon(sig.pair) : null),
          tf: sig.tf,
          dir: sig.dir,
          entry: +sig.entry,
          sl: +sig.sl,
          tps: parsedTps,
          dec: sig.dec != null ? Number(sig.dec) : (String(sig.entry).split(".")[1] || "").length || 2,
          strategy: sig.strategy || "",
          source: sig.source || "",
          lots: sig.lots ?? null,
          riskUsd: sig.riskUsd ?? null,
          auto: sig.auto !== undefined ? Boolean(sig.auto && bnSymbol) : Boolean(bnSymbol),
          bn: bnSymbol || null,
          hits: { tp: [null, null, null], sl: null, trailClosed: false },
          checkedFrom: Date.now(),
          lastCheck: null,
          manual: null,
          note: "",
          followed: null,
        };

        list.unshift(trade);
        save(list);
        return { trade, duplicate: false };
      }

      function update(id, patch) {
        const list = load(),
          i = list.findIndex((t) => t.id === id);
        if (i < 0) return null;
        list[i] = { ...list[i], ...patch };
        save(list);
        return list[i];
      }

      function remove(id) {
        save(load().filter((t) => t.id !== id));
      }

      function clearAll() {
        save([]);
      }

      function resultOf(t, winTp = settings().winTp) {
        const risk = Math.abs(t.entry - t.sl) || 1;
        const rOf = (n) => {
          const target = t.tps && t.tps[n - 1] != null ? t.tps[n - 1] : t.entry;
          return Math.abs(target - t.entry) / risk || n;
        };

        if (t.manual) {
          const m = t.manual;
          if (m.result === "win") return { state: "win", level: m.level, r: rOf(m.level), at: m.at, by: "manual" };
          if (m.result === "loss") return { state: "loss", r: -1, at: m.at, by: "manual" };
          return { state: "be", r: 0, at: m.at, by: "manual" };
        }

        const tpArr = (t.hits && Array.isArray(t.hits.tp)) ? t.hits.tp : [null, null, null];
        const slAt = t.hits ? t.hits.sl : null;
        const firstTpAt = tpArr.find((ts) => ts != null) || null;

        if (firstTpAt && (!slAt || firstTpAt < slAt)) {
          let highestLevel = 1;
          let highestAt = firstTpAt;
          for (let i = 0; i < tpArr.length; i++) {
            if (tpArr[i] != null && (!slAt || tpArr[i] < slAt)) {
              highestLevel = i + 1;
              highestAt = tpArr[i];
            }
          }
          return { state: "win", level: highestLevel, r: rOf(highestLevel), at: highestAt, by: "auto" };
        }

        if (slAt) return { state: "loss", r: -1, at: slAt, by: "auto" };
        return { state: "open", r: 0 };
      }

      const BYBIT = "https://api.bybit.com";
      const BYBIT_IV = { "1m": "1", "5m": "5", "15m": "15", "30m": "30", "1h": "60", "4h": "240", "1d": "D" };
      let bnDownUntil = 0;

      async function binanceRange(symbol, interval, startTime) {
        const out = [];
        let from = startTime;
        for (let page = 0; page < 15; page++) {
          let rows = null,
            lastErr;
          for (let n = 0; n < BN_HOSTS.length; n++) {
            const host = BN_HOSTS[(hostIdx + n) % BN_HOSTS.length];
            try {
              const r = await fetch(
                `${host}/api/v3/klines?symbol=${symbol}&interval=${interval}&startTime=${from}&limit=1000`,
                { signal: timeoutSignal(4000) }
              );
              if (!r.ok) throw new Error("Market data error " + r.status);
              rows = await r.json();
              hostIdx = (hostIdx + n) % BN_HOSTS.length;
              break;
            } catch (e) {
              lastErr = e;
            }
          }
          if (!rows) throw lastErr || new Error("Market data unavailable");
          rows.forEach((k) => out.push({ t: k[0], h: +k[2], l: +k[3] }));
          if (rows.length < 1000) break;
          from = rows[rows.length - 1][0] + 1;
        }
        return out;
      }

      async function bybitRange(symbol, interval, startTime) {
        const iv = BYBIT_IV[interval];
        if (!iv) throw new Error("Unsupported interval");
        const out = [];
        let end = Date.now();
        for (let page = 0; page < 15; page++) {
          const r = await fetch(
            `${BYBIT}/v5/market/kline?category=spot&symbol=${symbol}&interval=${iv}&start=${startTime}&end=${end}&limit=1000`,
            { signal: timeoutSignal(6000) }
          );
          if (!r.ok) throw new Error("Backup market data error " + r.status);
          const j = await r.json();
          if (j.retCode !== 0 || !j.result || !Array.isArray(j.result.list)) throw new Error("Backup market data unavailable");
          const rows = j.result.list;
          rows.forEach((k) => out.push({ t: +k[0], h: +k[2], l: +k[3] }));
          if (rows.length < 1000) break;
          end = +rows[rows.length - 1][0] - 1;
        }
        return out.sort((a, b) => a.t - b.t);
      }

      async function fetchRange(symbol, interval, startTime) {
        const order = Date.now() < bnDownUntil ? ["bybit", "binance"] : ["binance", "bybit"];
        let lastErr;
        for (const src of order) {
          try {
            const rows = src === "binance" ? await binanceRange(symbol, interval, startTime) : await bybitRange(symbol, interval, startTime);
            if (src === "binance") bnDownUntil = 0;
            return rows;
          } catch (e) {
            lastErr = e;
            if (src === "binance") bnDownUntil = Date.now() + 5 * 60 * 1000;
          }
        }
        throw lastErr || new Error("Market data unavailable");
      }

      function scan(t, candles) {
        const buy = t.dir === "BUY";
        if (!t.hits) t.hits = { tp: [null, null, null], sl: null, trailClosed: false };
        if (!Array.isArray(t.hits.tp)) t.hits.tp = [null, null, null];

        const earliestTp = t.hits.tp.find((ts) => ts != null);
        if (earliestTp && t.hits.sl && earliestTp < t.hits.sl) {
          t.hits.sl = null;
          t.hits.trailClosed = true;
        }

        for (const c of candles) {
          if (c.t < t.checkedFrom - 60000) continue;
          if (t.hits.sl || t.hits.trailClosed) break;
          if (t.tps.length && t.tps.every((_, i) => t.hits.tp[i])) break;

          const alreadyHitAnyTp = t.hits.tp.some((ts) => ts != null);
          const slHit = buy ? c.l <= t.sl : c.h >= t.sl;
          const tpHitsNow = [];

          t.tps.forEach((p, i) => {
            if (!t.hits.tp[i] && (buy ? c.h >= p : c.l <= p)) {
              tpHitsNow.push(i);
            }
          });

          if (alreadyHitAnyTp) {
            tpHitsNow.forEach((i) => {
              t.hits.tp[i] = c.t;
            });
            const pulledBackToEntryOrSl = buy ? c.l <= Math.max(t.entry, t.sl) : c.h >= Math.min(t.entry, t.sl);
            if (slHit || pulledBackToEntryOrSl) {
              t.hits.trailClosed = true;
              break;
            }
            continue;
          }

          if (slHit && tpHitsNow.length) {
            t.hits.sl = c.t;
            break;
          }
          if (slHit) {
            t.hits.sl = c.t;
            break;
          }
          tpHitsNow.forEach((i) => {
            t.hits.tp[i] = c.t;
          });
        }
        if (candles.length) t.checkedFrom = candles[candles.length - 1].t;
        t.lastCheck = Date.now();
      }

      async function trackAll() {
        const list = load();
        let checked = 0,
          resolved = 0,
          failed = 0,
          repaired = 0;
        for (const t of list) {
          if (t.hits && Array.isArray(t.hits.tp) && t.hits.sl) {
            const firstTp = t.hits.tp.find((ts) => ts != null);
            if (firstTp && firstTp < t.hits.sl) {
              t.hits.sl = null;
              t.hits.trailClosed = true;
              repaired++;
            }
          }

          const allTpsHit = t.tps && t.tps.length && t.tps.every((_, i) => t.hits && t.hits.tp && t.hits.tp[i]);
          const isStillTracking = !t.hits?.sl && !t.hits?.trailClosed && !allTpsHit;

          if (!t.auto || !t.bn || t.manual || !isStillTracking) continue;
          try {
            const wasOpen = resultOf(t).state === "open";
            const age = Date.now() - t.createdAt;
            const candles = await fetchRange(t.bn, age > 3 * 864e5 ? "5m" : "1m", t.checkedFrom);
            scan(t, candles);
            checked++;
            if (wasOpen && resultOf(t).state !== "open") resolved++;
          } catch (e) {
            failed++;
          }
        }
        if (checked || repaired) save(list);
        return { checked, resolved, failed };
      }

      function stats(list) {
        const rows = list.map((t) => ({ t, r: resultOf(t) }));
        const done = rows
          .filter((x) => x.r.state !== "open")
          .sort((a, b) => (a.r.at || a.t.createdAt || 0) - (b.r.at || b.t.createdAt || 0));
        const wins = done.filter((x) => x.r.state === "win"),
          losses = done.filter((x) => x.r.state === "loss"),
          be = done.filter((x) => x.r.state === "be");
        const totalR = done.reduce((s, x) => s + x.r.r, 0);
        const gp = wins.reduce((s, x) => s + x.r.r, 0),
          gl = Math.abs(losses.reduce((s, x) => s + x.r.r, 0));
        const decided = wins.length + losses.length;
        let run = 0,
          peak = 0,
          maxDd = 0;
        const curve = done.map((x) => {
          run += x.r.r;
          peak = Math.max(peak, run);
          maxDd = Math.max(maxDd, peak - run);
          return run;
        });
        let bestStreak = 0,
          cur = 0;
        done.forEach((x) => {
          if (x.r.state === "win") {
            cur++;
            bestStreak = Math.max(bestStreak, cur);
          } else if (x.r.state === "loss") {
            cur = 0;
          }
        });
        const byPair = {};
        done.forEach((x) => {
          const p = (byPair[x.t.pair] ||= {
            pair: x.t.pair,
            image: window.getPairIcon ? window.getPairIcon(x.t.pair) : null,
            wins: 0,
            losses: 0,
            r: 0
          });
          if (x.r.state === "win") p.wins++;
          else if (x.r.state === "loss") p.losses++;
          p.r += x.r.r;
        });

        return {
          total: list.length,
          open: rows.length - done.length,
          closed: done.length,
          wins: wins.length,
          losses: losses.length,
          be: be.length,
          winRate: decided ? (wins.length / decided) * 100 : null,
          totalR,
          avgR: done.length ? totalR / done.length : null,
          profitFactor: gl > 0 ? gp / gl : gp > 0 ? Infinity : null,
          maxDd,
          bestStreak,
          curve,
          byPair: Object.values(byPair).sort((a, b) => b.r - a.r),
        };
      }

      window.PorTrades = {
        load,
        save,
        add,
        update,
        remove,
        clearAll,
        resultOf,
        trackAll,
        stats,
        settings,
        setSettings,
        getPairIcon: window.getPairIcon,
        getPairIconHtml: window.getPairIconHtml,
      };
      window.TradesStore = window.PorTrades;
    })();
  }
</script>
